<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VO2Strength</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a;
  --surface:#111111;
  --surface2:#181818;
  --border:#222222;
  --border2:#2a2a2a;
  --text:#f0ede6;
  --dim:#555555;
  --dim2:#333333;
  --push:#e8ff5a;
  --pull:#5af0ff;
  --legs:#ff8c5a;
  --upper:#c45aff;
  --lower:#5aff8c;
  --run:#ff5a8c;
  --custom:#ffaa5a;
  --red:#ff3355;
  --tab-h:60px;
}
html,body{height:100%;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;}

/* ── TOPBAR ── */
.topbar{height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;letter-spacing:-.02em;color:var(--text);}
.logo span{color:var(--red);}
.topbar-right{display:flex;align-items:center;gap:.75rem;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;color:var(--dim);}

/* ── CONTENT ── */
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h) + 8px);}

/* ── TABS ── */
.tabs{height:var(--tab-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;padding:0;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.tab-icon{font-size:1.1rem;line-height:1;}
.tab-label{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}
.tab.active .tab-label{color:var(--text);}
.tab.active .tab-icon{filter:brightness(1.2);}
.tab-indicator{width:20px;height:2px;border-radius:99px;background:transparent;margin-top:2px;}
.tab.active .tab-indicator{background:var(--text);}

/* ── DAY TYPE PILLS ── */
.day-pills{display:flex;gap:.4rem;overflow-x:auto;padding:.85rem 1.25rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.day-pills::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;padding:5px 14px;border-radius:4px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--dim);transition:all .15s;}
.day-pill.active{color:#0a0a0a;}

/* ── SET ROWS ── */
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:.5rem 1rem;overflow:hidden;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.set-head{display:flex;align-items:center;justify-content:space-between;padding:.6rem .85rem;border-bottom:1px solid var(--border);}
.set-num{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;color:var(--dim);letter-spacing:.08em;}
.set-del{background:none;border:none;color:var(--dim2);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;line-height:1;}
.set-del:hover{color:var(--red);}
.set-body{padding:.65rem .85rem;display:flex;flex-direction:column;gap:.5rem;}
select,input[type=text],input[type=number]{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:6px;font-family:'DM Mono',monospace;font-size:13px;outline:none;-webkit-appearance:none;appearance:none;}
select{height:36px;padding:0 10px;}
input[type=text],input[type=number]{height:36px;padding:0 10px;}
select:focus,input:focus{border-color:var(--dim);}
.set-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;}
.field-wrap{display:flex;flex-direction:column;gap:.25rem;}
.field-label{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);}
.note-input{color:var(--dim) !important;font-size:12px !important;}
.note-input::placeholder{color:var(--dim2);}

/* ── ADD SET BTN ── */
.add-set-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:calc(100% - 2rem);margin:.4rem 1rem;height:38px;background:transparent;border:1px dashed var(--border2);border-radius:8px;color:var(--dim);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;transition:all .15s;}
.add-set-btn:hover{border-color:var(--dim);color:var(--text);}

/* ── SAVE BTN ── */
.save-btn{display:flex;align-items:center;justify-content:center;width:calc(100% - 2rem);margin:.75rem 1rem;height:48px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:.02em;}
.save-btn.unsaved{background:var(--push);color:#0a0a0a;}
.save-btn.saved{background:var(--surface2);color:#5aff8c;border:1px solid #5aff8c33;}

/* ── SECTION HEADER ── */
.sec-head{padding:.85rem 1.25rem .5rem;display:flex;align-items:baseline;justify-content:space-between;}
.sec-title{font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;color:var(--text);}
.sec-meta{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;}

/* ── HISTORY CARDS ── */
.hist-card{margin:.5rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.hist-card:hover{border-color:var(--border2);}
.hist-head{padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
.hist-day-tag{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 9px;border-radius:3px;color:#0a0a0a;}
.hist-date{font-size:12px;color:var(--dim);}
.hist-meta{font-size:11px;color:var(--dim2);}
.hist-arrow{font-size:10px;color:var(--dim2);flex-shrink:0;}
.hist-body{border-top:1px solid var(--border);padding:.85rem 1rem;}
.hist-exercise-group{margin-bottom:1rem;}
.hist-exercise-group:last-child{margin-bottom:0;}
.hist-ex-name{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.4rem;}
.hist-set-row{display:flex;justify-content:space-between;align-items:baseline;padding:.3rem 0;border-bottom:1px solid var(--border);font-size:12px;}
.hist-set-row:last-child{border-bottom:none;}
.hist-set-num{color:var(--dim2);}
.hist-set-vals{display:flex;gap:.75rem;align-items:baseline;}
.hist-weight{color:var(--text);}
.hist-reps{color:var(--dim);}
.hist-rpe{font-size:10px;padding:1px 6px;border-radius:3px;}
.hist-note{color:var(--dim2);font-size:11px;margin-top:2px;}

/* ── FILTER PILLS ── */
.filter-pills{display:flex;gap:.4rem;padding:.75rem 1.25rem;overflow-x:auto;scrollbar-width:none;}
.filter-pills::-webkit-scrollbar{display:none;}
.filter-pill{flex-shrink:0;padding:4px 12px;border-radius:4px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--dim);transition:all .15s;}
.filter-pill.active{color:#0a0a0a;}

/* ── BODY TAB ── */
.weight-display{padding:1.25rem;border-bottom:1px solid var(--border);}
.weight-big{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;color:var(--text);line-height:1;}
.weight-unit{font-size:14px;color:var(--dim);margin-left:.35rem;}
.weight-delta{font-size:12px;margin-left:.5rem;}
.mini-graph{display:flex;align-items:flex-end;gap:3px;height:48px;margin-top:.85rem;}
.mini-bar{flex:1;border-radius:2px 2px 0 0;transition:height .4s,background .2s;min-height:2px;cursor:pointer;}
.muscle-list{padding:.5rem 0;}
.muscle-row{display:flex;align-items:center;gap:.85rem;padding:.7rem 1.25rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.muscle-row:hover{background:var(--surface);}
.muscle-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.muscle-name-col{flex:1;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;}
.muscle-sets-col{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace;}
.muscle-bar-wrap{width:60px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.muscle-bar-fill{height:100%;border-radius:99px;}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;}
.cal-month{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;}
.cal-btn{width:30px;height:30px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 1.25rem .4rem;}
.cal-day-label{text-align:center;font-size:9px;font-weight:500;letter-spacing:.06em;color:var(--dim2);padding:3px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 1.25rem .85rem;}
.cal-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--dim);background:var(--surface);border:1px solid transparent;cursor:default;transition:all .15s;}
.cal-cell.has-log{cursor:pointer;}
.cal-cell.has-log:hover{border-color:var(--border2);}
.cal-cell.today{border-color:var(--dim);color:var(--text);}
.cal-cell.future{opacity:.25;}
.cal-dot{width:4px;height:4px;border-radius:50%;}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:3rem 2rem;text-align:center;}
.empty-icon{font-size:2.25rem;}
.empty-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;}
.empty-sub{font-size:12px;color:var(--dim);line-height:1.7;max-width:260px;}
.btn-primary{background:var(--push);color:#0a0a0a;border:none;border-radius:7px;padding:10px 22px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}

/* ── REST TIMER ── */
.rest-bar{position:fixed;top:52px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.25rem;z-index:100;animation:slideDown .25s ease;}
@keyframes slideDown{from{transform:translateX(-50%) translateY(-100%);}to{transform:translateX(-50%) translateY(0);}}
.rest-label{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;}
.rest-count{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;color:var(--push);}
.rest-skip{font-size:11px;color:var(--dim);cursor:pointer;padding:4px 8px;border-radius:4px;border:1px solid var(--border2);}
.rest-skip:hover{color:var(--text);}

/* ── AUTH ── */
.auth-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:2rem;}
.auth-box{width:100%;max-width:360px;}
.auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;color:var(--text);letter-spacing:-.03em;text-align:center;margin-bottom:.25rem;}
.auth-logo span{color:var(--red);}
.auth-sub{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-bottom:2rem;}
.auth-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:3px;margin-bottom:1.25rem;}
.auth-tab-btn{flex:1;padding:8px;border:none;border-radius:5px;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--dim);}
.auth-tab-btn.active{background:var(--surface2);color:var(--text);}
.auth-field{margin-bottom:.65rem;}
.auth-field input{height:44px;padding:0 14px;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:7px;width:100%;font-family:'DM Mono',monospace;font-size:13px;outline:none;}
.auth-field input:focus{border-color:var(--dim);}
.auth-pw-wrap{position:relative;}
.auth-pw-wrap input{padding-right:44px;}
.auth-pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:4px;}
.auth-submit{width:100%;height:46px;background:var(--push);color:#0a0a0a;border:none;border-radius:7px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:.25rem;}
.auth-submit:disabled{opacity:.5;cursor:not-allowed;}
.auth-error{padding:.65rem .85rem;border-radius:6px;font-size:12px;margin-bottom:.75rem;display:none;}
.auth-error.err{background:#1a0a0a;border:1px solid #3a1010;color:#ff6666;}
.auth-error.ok{background:#0a1a0a;border:1px solid #103a10;color:#5aff8c;}
.auth-guest{text-align:center;margin-top:.85rem;}
.auth-guest button{background:none;border:none;color:var(--dim2);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;}

/* ── LOG TAB SESSIONS ── */
.log-session-head{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.25rem;background:var(--surface2);border-bottom:1px solid var(--border);margin-top:-.5rem;}
.log-session-stat{text-align:center;}
.log-session-stat-val{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);}
.log-session-stat-label{font-size:9px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">VO2<span>Strength</span></div>
    <div class="topbar-right">
      <a href="/" style="font-size:10px;color:var(--dim);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;">Plan</a>
      <div class="avatar" id="user-avatar" onclick="showUserMenu()">?</div>
    </div>
  </div>
  <div id="content"></div>
  <div class="tabs">
    <button class="tab active" id="tab-log" onclick="switchTab('log')">
      <span class="tab-icon">✏️</span>
      <span class="tab-label">Log</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab" id="tab-history" onclick="switchTab('history')">
      <span class="tab-icon">📋</span>
      <span class="tab-label">History</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab" id="tab-body" onclick="switchTab('body')">
      <span class="tab-icon">⚡</span>
      <span class="tab-label">Body</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab" id="tab-calendar" onclick="switchTab('calendar')">
      <span class="tab-icon">📅</span>
      <span class="tab-label">Calendar</span>
      <div class="tab-indicator"></div>
    </button>
  </div>
</div>

<div id="rest-timer-bar" style="display:none;" class="rest-bar">
  <div>
    <div class="rest-label">Rest Timer</div>
    <div style="font-size:10px;color:var(--dim2);" id="rest-ex-name"></div>
  </div>
  <div class="rest-count" id="rest-count">1:30</div>
  <div class="rest-skip" onclick="skipRest()">Skip</div>
</div>

<script>
const SUPABASE_URL = 'https://lopiiqqvztixecckqixy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_15QvGftRwFrz632jFtSy8g_AeOoiSe6';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── CONFIG ──
const DAY_TYPES = ['Push','Pull','Legs','Upper','Lower','Run','Custom'];
const DAY_COLORS = {Push:'#e8ff5a',Pull:'#5af0ff',Legs:'#ff8c5a',Upper:'#c45aff',Lower:'#5aff8c',Run:'#ff5a8c',Custom:'#ffaa5a'};
const RPE_LABELS = {6:'Easy',7:'Moderate',8:'Hard',9:'Very Hard',10:'Max'};

const EXERCISES = {
  Push:['Barbell Bench Press','DB Bench Press','Overhead Press','DB Shoulder Press','Incline Barbell Press','Incline DB Press','Cable Lateral Raise','DB Lateral Raise','Cable Front Raise','DB Front Raise','Tricep Rope Pushdown','Overhead Tricep Extension','Skullcrusher','Chest Press Machine','Pec Deck Machine','Cable Fly','Dips'],
  Pull:['Pull-ups','Weighted Pull-ups','Barbell Row','DB Row','One Arm Cable Row','Lat Pulldown','Cable Row','Chest-Supported Row','Landmine Row','Face Pulls','Incline DB Curl','Dumbbell Curl','Hammer Curl','EZ Bar Curl','Barbell Curl','Deadlift','Preacher Curl Machine'],
  Legs:['Barbell Back Squat','Hack Squat','Leg Press','Romanian Deadlift','Bulgarian Split Squat','Walking Lunges','Reverse Lunges','Leg Curl','Standing Single Leg Curl','Leg Extension','Hip Thrust','Hip Thrust Machine','Calf Raise','Seated Calf Raise','Box Jump','Trap Bar Deadlift','Front Squat','Hip Abduction','Hip Adduction','Nordic Curls','Sled Push','Copenhagen Adductor'],
  Upper:['Barbell Bench Press','DB Bench Press','Incline DB Press','Pull-ups','DB Row','Overhead Press','Cable Row','Lat Pulldown','Chest Fly','DB Lateral Raise','Leg Press','Seated Leg Curl','Incline DB Curl','Tricep Rope Pushdown','Dead Bug','Plank','Ab Wheel Rollout','Pallof Press'],
  Lower:['Front Squat','Hack Squat','Stiff-Leg Deadlift','Bulgarian Split Squat','Leg Press','Seated Leg Curl','Hip Adduction','Calf Raise','Reverse Lunges','Hip Thrust'],
  Run:['Treadmill Run','Outdoor Run','Tempo Run','Sprint Intervals','Easy Jog','400m Repeats','800m Repeats','5K Run','Long Run','Interval Run'],
  Custom:['Burpees','Kettlebell Swing','Thruster','Wall Ball','Box Jump','Medicine Ball Slam','Battle Ropes','Tire Flip','Clean & Press','Snatch','Power Clean']
};

// ── STATE ──
let currentUser = null;
let activeTab = 'log';
let activeDayType = 'Push';
let currentSets = [{exercise:'Barbell Bench Press',weight:'',reps:'',rpe:'',note:''}];
let savedState = false;
let workoutLogs = [];
let bodyStats = [];
let filterDay = 'All';
let expandedSession = null;
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let restInterval = null;
let restSeconds = 90;
let currentPlan = null;

// ── AUTH ──
sb.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user || null;
  if(currentUser){
    const meta = currentUser.user_metadata||{};
    const name = meta.username||meta.full_name;
    const initials = name?name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2):currentUser.email[0].toUpperCase();
    document.getElementById('user-avatar').textContent = initials;
    document.getElementById('auth-screen')?.remove();
    renderTab(activeTab);
    loadData();
  } else {
    showAuth();
  }
});

async function loadData(){
  try {
    const [logs, stats, plan] = await Promise.all([
      sb.from('workout_logs').select('*').eq('user_id',currentUser.id).order('date',{ascending:false}).limit(100),
      sb.from('body_stats').select('*').eq('user_id',currentUser.id).order('date',{ascending:false}).limit(30),
      sb.from('generated_plans').select('*').eq('user_id',currentUser.id).eq('is_active',true).single()
    ]);
    workoutLogs = logs.data||[];
    bodyStats = stats.data||[];
    if(plan.data) currentPlan = plan.data.plan_json;
    renderTab(activeTab);
  } catch(e){ console.log('Load error:',e.message); }
}

// ── TAB SWITCHING ──
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderTab(tab);
}

function renderTab(tab){
  const c = document.getElementById('content');
  if(tab==='log') renderLogTab(c);
  else if(tab==='history') renderHistoryTab(c);
  else if(tab==='body') renderBodyTab(c);
  else if(tab==='calendar') renderCalendarTab(c);
}

// ── LOG TAB ──
function renderLogTab(c){
  const color = DAY_COLORS[activeDayType]||'#e8ff5a';
  const exList = EXERCISES[activeDayType]||EXERCISES.Push;

  let html = `<div class="day-pills">
    ${DAY_TYPES.map(d=>`<div class="day-pill ${activeDayType===d?'active':''}" style="${activeDayType===d?'background:'+DAY_COLORS[d]+';border-color:'+DAY_COLORS[d]+';':''}" onclick="setDayType('${d}')">${d}</div>`).join('')}
  </div>

  <div style="padding:.25rem 1.25rem .5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
    <div style="display:flex;align-items:center;gap:.5rem;">
      <input type="number" id="bw-input" placeholder="BW lbs" style="width:80px;height:28px;font-size:11px;text-align:center;border-color:var(--border2);color:var(--dim);" value="">
    </div>
  </div>`;

  // Sets
  currentSets.forEach((s,i) => {
    html += `<div class="set-card" id="set-${i}">
      <div class="set-head">
        <span class="set-num" style="color:${color};">SET ${i+1}</span>
        <button class="set-del" onclick="removeSet(${i})">×</button>
      </div>
      <div class="set-body">
        <select onchange="updateSet(${i},'exercise',this.value)">
          ${exList.map(ex=>`<option value="${ex}" ${s.exercise===ex?'selected':''}>${ex}</option>`).join('')}
          ${!exList.includes(s.exercise)?`<option value="${s.exercise}" selected>${s.exercise}</option>`:''}
        </select>
        <div class="set-fields">
          <div class="field-wrap">
            <div class="field-label">Weight</div>
            <input type="text" placeholder="—" value="${s.weight}" onchange="updateSet(${i},'weight',this.value)" oninput="updateSet(${i},'weight',this.value)"/>
          </div>
          <div class="field-wrap">
            <div class="field-label">Reps</div>
            <input type="text" placeholder="—" value="${s.reps}" onchange="updateSet(${i},'reps',this.value)" oninput="updateSet(${i},'reps',this.value)"/>
          </div>
          <div class="field-wrap">
            <div class="field-label">RPE</div>
            <select onchange="updateSet(${i},'rpe',this.value)">
              <option value="">—</option>
              ${[6,7,8,9,10].map(r=>`<option value="${r}" ${s.rpe==r?'selected':''}>${r} · ${RPE_LABELS[r]}</option>`).join('')}
            </select>
          </div>
        </div>
        <input type="text" class="note-input" placeholder="Note (e.g. per hand, PR, drop set...)" value="${s.note}" onchange="updateSet(${i},'note',this.value)" oninput="updateSet(${i},'note',this.value)"/>
      </div>
    </div>`;
  });

  html += `<button class="add-set-btn" onclick="addSet()">+ Add Set</button>
  <button class="save-btn ${savedState?'saved':'unsaved'}" id="save-btn" onclick="saveSession()">${savedState?'✓ Saved':'Save Session'}</button>`;

  // Today's plan preview if available
  if(currentPlan?.weeklySchedule){
    const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const todayPlan = currentPlan.weeklySchedule.find(d=>d.day===dayNames[new Date().getDay()]);
    if(todayPlan && !todayPlan.type?.toLowerCase().includes('rest')){
      html += `<div style="margin:0 1rem 1rem;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:.75rem;">
        <div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin-bottom:.5rem;">Today's Plan: ${todayPlan.focus||''}</div>
        ${(todayPlan.exercises||[]).slice(0,4).map(ex=>`<div style="font-size:11px;color:var(--dim);padding:.2rem 0;">· ${ex}</div>`).join('')}
      </div>`;
    }
  }

  c.innerHTML = html;
}

function setDayType(type){
  activeDayType = type;
  if(currentSets.length>0){
    const exList = EXERCISES[type]||EXERCISES.Push;
    currentSets[0].exercise = exList[0];
  }
  savedState = false;
  renderTab('log');
}

function addSet(){
  const last = currentSets[currentSets.length-1];
  currentSets.push({exercise:last.exercise,weight:last.weight,reps:last.reps,rpe:last.rpe,note:''});
  savedState = false;
  renderTab('log');
  setTimeout(()=>{
    const sets = document.querySelectorAll('.set-card');
    sets[sets.length-1]?.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
  startRestTimer(last.exercise);
}

function removeSet(i){
  if(currentSets.length<=1) return;
  currentSets.splice(i,1);
  renderTab('log');
}

function updateSet(i,field,val){
  if(currentSets[i]) currentSets[i][field]=val;
  savedState = false;
}

async function saveSession(){
  if(!currentUser) return;
  const bw = document.getElementById('bw-input')?.value;
  const today = new Date().toISOString().split('T')[0];
  let totalVol = 0;
  currentSets.forEach(s=>{ if(s.weight&&s.reps&&!isNaN(s.weight)&&!isNaN(s.reps)) totalVol+=parseFloat(s.weight)*parseFloat(s.reps); });

  try {
    await sb.from('workout_logs').insert({
      user_id:currentUser.id,
      date:today,
      day_name:activeDayType,
      session_name:activeDayType,
      exercises_json:currentSets,
      completed:true,
      duration_min:null,
      total_volume:totalVol||null
    });

    // Save exercise history
    const byEx = {};
    currentSets.forEach(s=>{if(s.exercise){if(!byEx[s.exercise])byEx[s.exercise]=[];byEx[s.exercise].push(s);}});
    for(const [ex,sets] of Object.entries(byEx)){
      const maxEst = Math.max(...sets.map(s=>{
        const w=parseFloat(s.weight)||0,r=parseInt(s.reps)||0;
        return w>0&&r>0?Math.round(w*(1+r/30)):0;
      }));
      await sb.from('exercise_history').insert({user_id:currentUser.id,exercise_name:ex,date:today,sets_json:sets,estimated_1rm:maxEst||null});
    }

    if(bw && !isNaN(parseFloat(bw))){
      await sb.from('body_stats').insert({user_id:currentUser.id,date:today,weight_lbs:parseFloat(bw)});
    }

    savedState = true;
    workoutLogs = [{user_id:currentUser.id,date:today,day_name:activeDayType,session_name:activeDayType,exercises_json:currentSets,completed:true,total_volume:totalVol},...workoutLogs];
    renderTab('log');
  } catch(e){ alert('Save failed: '+e.message); }
}

// ── REST TIMER ──
function startRestTimer(exName){
  clearInterval(restInterval);
  restSeconds = 90;
  const bar = document.getElementById('rest-timer-bar');
  document.getElementById('rest-ex-name').textContent = exName;
  bar.style.display='flex';
  function tick(){
    const m=Math.floor(restSeconds/60),s=restSeconds%60;
    document.getElementById('rest-count').textContent=m+':'+String(s).padStart(2,'0');
    if(restSeconds<=0){clearInterval(restInterval);bar.style.display='none';}
    restSeconds--;
  }
  tick();
  restInterval=setInterval(tick,1000);
}
function skipRest(){clearInterval(restInterval);document.getElementById('rest-timer-bar').style.display='none';}

// ── HISTORY TAB ──
function renderHistoryTab(c){
  const filtered = filterDay==='All'?workoutLogs:workoutLogs.filter(l=>l.day_name===filterDay);

  let html = `<div class="filter-pills">
    ${['All',...DAY_TYPES].map(d=>`<div class="filter-pill ${filterDay===d?'active':''}" style="${filterDay===d&&DAY_COLORS[d]?'background:'+DAY_COLORS[d]+';border-color:'+DAY_COLORS[d]+';':filterDay===d?'background:var(--surface2);border-color:var(--dim);color:var(--text);':''}" onclick="setFilter('${d}')">${d}</div>`).join('')}
  </div>
  <div class="sec-head"><span class="sec-title">${filtered.length} Session${filtered.length!==1?'s':''}</span></div>`;

  if(!filtered.length){
    html += `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No sessions yet</div><div class="empty-sub">Log your first workout to see your history here.</div></div>`;
    c.innerHTML=html; return;
  }

  filtered.forEach(session => {
    const color = DAY_COLORS[session.day_name]||'#e8ff5a';
    const isExp = expandedSession===session.id||expandedSession===session.date;
    const sets = Array.isArray(session.exercises_json)?session.exercises_json:[];
    const setCount = sets.length;

    // Group sets by exercise
    const grouped = {};
    sets.forEach(s=>{ if(!grouped[s.exercise])grouped[s.exercise]=[]; grouped[s.exercise].push(s); });

    const d = new Date(session.date+'T00:00:00');
    const dateLabel = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

    html += `<div class="hist-card" onclick="toggleSession('${session.id||session.date}')">
      <div class="hist-head">
        <div style="display:flex;align-items:center;gap:.6rem;">
          <span class="hist-day-tag" style="background:${color};">${(session.day_name||'').toUpperCase()}</span>
          <span class="hist-date">${dateLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:.75rem;">
          <span class="hist-meta">${setCount} sets${session.total_volume?' · '+Math.round(session.total_volume).toLocaleString()+' lbs':''}</span>
          <span class="hist-arrow">${isExp?'▲':'▼'}</span>
        </div>
      </div>
      ${isExp?`<div class="hist-body">
        ${Object.entries(grouped).map(([ex,exSets])=>`
          <div class="hist-exercise-group">
            <div class="hist-ex-name" style="color:${color};">${ex}</div>
            ${exSets.map((s,i)=>`
              <div class="hist-set-row">
                <span class="hist-set-num">Set ${i+1}</span>
                <div class="hist-set-vals">
                  ${s.weight?`<span class="hist-weight">${s.weight} lbs</span>`:''}
                  ${s.reps?`<span class="hist-reps">× ${s.reps}</span>`:''}
                  ${s.rpe?`<span class="hist-rpe" style="background:${color}22;color:${color};">RPE ${s.rpe}</span>`:''}
                </div>
              </div>
              ${s.note?`<div class="hist-note">${s.note}</div>`:''}`).join('')}
          </div>`).join('')}
      </div>`:''}
    </div>`;
  });

  c.innerHTML = html;
}

function setFilter(day){ filterDay=day; renderTab('history'); }
function toggleSession(id){ expandedSession=expandedSession===id?null:id; renderTab('history'); }

// ── BODY TAB ──
function renderBodyTab(c){
  const muscles = [
    {id:'chest',name:'Chest',color:'#e8ff5a'},
    {id:'back',name:'Back',color:'#5af0ff'},
    {id:'legs',name:'Legs',color:'#ff8c5a'},
    {id:'shoulders',name:'Shoulders',color:'#c45aff'},
    {id:'arms',name:'Arms',color:'#ffaa5a'},
    {id:'core',name:'Core',color:'#5aff8c'},
  ];

  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate()-weekStart.getDay());
  const weekStartStr = weekStart.toISOString().split('T')[0];
  const weekLogs = workoutLogs.filter(l=>l.date>=weekStartStr);

  const muscleVol = {};
  muscles.forEach(m=>{muscleVol[m.id]={sets:0,volume:0};});
  weekLogs.forEach(log=>{
    const sets = Array.isArray(log.exercises_json)?log.exercises_json:[];
    sets.forEach(s=>{
      const lower=(s.exercise||'').toLowerCase();
      let muscle='core';
      if(lower.includes('bench')||lower.includes('chest')||lower.includes('fly')||lower.includes('push')) muscle='chest';
      else if(lower.includes('row')||lower.includes('pull')||lower.includes('lat')||lower.includes('deadlift')) muscle='back';
      else if(lower.includes('squat')||lower.includes('leg')||lower.includes('hip')||lower.includes('lunge')||lower.includes('hamstring')||lower.includes('glute')||lower.includes('calf')) muscle='legs';
      else if(lower.includes('press')&&!lower.includes('bench')||lower.includes('lateral')||lower.includes('shoulder')||lower.includes('delt')) muscle='shoulders';
      else if(lower.includes('curl')||lower.includes('tricep')||lower.includes('bicep')||lower.includes('arm')) muscle='arms';
      muscleVol[muscle].sets++;
      if(s.weight&&s.reps&&!isNaN(s.weight)&&!isNaN(s.reps)) muscleVol[muscle].volume+=parseFloat(s.weight)*parseFloat(s.reps);
    });
  });

  const maxSets = Math.max(...Object.values(muscleVol).map(v=>v.sets),1);

  let html = `<div class="weight-display">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;">
      <div>
        <div style="font-size:9px;color:var(--dim2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem;">Body Weight</div>
        ${bodyStats.length?`<div style="display:flex;align-items:baseline;gap:.25rem;">
          <span class="weight-big">${bodyStats[0].weight_lbs}</span>
          <span class="weight-unit">lbs</span>
          ${bodyStats.length>1?`<span class="weight-delta" style="color:${bodyStats[0].weight_lbs>bodyStats[1].weight_lbs?'#ff6666':'#5aff8c'};">${bodyStats[0].weight_lbs>bodyStats[1].weight_lbs?'▲':'▼'}${Math.abs(bodyStats[0].weight_lbs-bodyStats[1].weight_lbs).toFixed(1)}</span>`:''}
        </div>`:`<div style="font-size:13px;color:var(--dim);">Not logged yet</div>`}
      </div>
      <button onclick="logWeight()" style="background:var(--surface2);border:1px solid var(--border2);color:var(--dim);border-radius:6px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">+ Log</button>
    </div>
    ${bodyStats.length?`<div class="mini-graph">
      ${bodyStats.slice(0,14).reverse().map((s,i,arr)=>{
        const min=Math.min(...arr.map(x=>x.weight_lbs));
        const max=Math.max(...arr.map(x=>x.weight_lbs));
        const pct=((s.weight_lbs-min)/(max-min||1)*70+20);
        const isToday=s.date===new Date().toISOString().split('T')[0];
        return `<div class="mini-bar" style="height:${pct}%;background:${isToday?'var(--push)':'var(--border2)'};"></div>`;
      }).join('')}
    </div>`:''}
  </div>

  <div class="sec-head"><span class="sec-title">This Week</span><span class="sec-meta">Resets Monday</span></div>
  <div class="muscle-list">
    ${muscles.map(m=>`<div class="muscle-row">
      <div class="muscle-dot" style="background:${muscleVol[m.id].sets>0?m.color:'var(--border2)'}"></div>
      <div class="muscle-name-col">${m.name}</div>
      <div class="muscle-sets-col">${muscleVol[m.id].sets} sets${muscleVol[m.id].volume?` · ${Math.round(muscleVol[m.id].volume).toLocaleString()} lbs`:''}</div>
      <div class="muscle-bar-wrap"><div class="muscle-bar-fill" style="width:${muscleVol[m.id].sets/maxSets*100}%;background:${m.color};"></div></div>
    </div>`).join('')}
  </div>`;

  c.innerHTML = html;
}

async function logWeight(){
  const w = prompt('Body weight (lbs):');
  if(!w||isNaN(parseFloat(w))) return;
  try {
    await sb.from('body_stats').insert({user_id:currentUser.id,date:new Date().toISOString().split('T')[0],weight_lbs:parseFloat(w)});
    bodyStats = [{date:new Date().toISOString().split('T')[0],weight_lbs:parseFloat(w)},...bodyStats];
    renderTab('body');
  } catch(e){ alert('Could not save.'); }
}

// ── CALENDAR TAB ──
function renderCalendarTab(c){
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayLabels=['Su','Mo','Tu','We','Th','Fr','Sa'];

  const firstDay=new Date(calYear,calMonth,1);
  const totalDays=new Date(calYear,calMonth+1,0).getDate();
  const startDow=firstDay.getDay();

  // Get logs for this month
  const monthStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthLogs = workoutLogs.filter(l=>l.date?.startsWith(monthStr));
  const logsByDate={};
  monthLogs.forEach(l=>{if(!logsByDate[l.date])logsByDate[l.date]=[];logsByDate[l.date].push(l);});

  let html = `<div class="cal-nav">
    <button class="cal-btn" onclick="changeCalMonth(-1)">‹</button>
    <div class="cal-month">${monthNames[calMonth]} ${calYear}</div>
    <button class="cal-btn" onclick="changeCalMonth(1)">›</button>
  </div>
  <div class="cal-grid-head">${dayLabels.map(d=>`<div class="cal-day-label">${d}</div>`).join('')}</div>
  <div class="cal-grid">
    ${Array(startDow).fill('<div></div>').join('')}
    ${Array.from({length:totalDays},(_,i)=>{
      const day=i+1;
      const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const logs=logsByDate[ds]||[];
      const isToday=ds===todayStr;
      const isFuture=ds>todayStr;
      const color=logs.length?DAY_COLORS[logs[0].day_name]||'#e8ff5a':'';
      return `<div class="cal-cell ${logs.length?'has-log':''} ${isToday?'today':''} ${isFuture?'future':''}" 
        style="${isToday?'border-color:var(--dim);color:var(--text);':''}" 
        onclick="${logs.length?`showDayLog('${ds}')`:''}"
        title="${logs.length?logs.map(l=>l.session_name||l.day_name).join(', '):''}">
        ${day}
        ${logs.length?`<div class="cal-dot" style="background:${color};"></div>`:''}
      </div>`;
    }).join('')}
  </div>`;

  // Recent sessions below calendar
  if(workoutLogs.length){
    html += `<div class="sec-head"><span class="sec-title">Recent</span><span class="sec-meta" style="cursor:pointer;" onclick="switchTab('history')">View all →</span></div>`;
    workoutLogs.slice(0,5).forEach(log=>{
      const color=DAY_COLORS[log.day_name]||'#e8ff5a';
      const d=new Date(log.date+'T00:00:00');
      const label=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      const sets=Array.isArray(log.exercises_json)?log.exercises_json:[];
      html+=`<div class="hist-card" onclick="switchTab('history')">
        <div class="hist-head">
          <div style="display:flex;align-items:center;gap:.6rem;">
            <span class="hist-day-tag" style="background:${color};">${(log.day_name||'').toUpperCase()}</span>
            <span class="hist-date">${label}</span>
          </div>
          <span class="hist-meta">${sets.length} sets</span>
        </div>
      </div>`;
    });
  }

  c.innerHTML = html;
}

function changeCalMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderTab('calendar');
}

function showDayLog(dateStr){
  const logs = workoutLogs.filter(l=>l.date===dateStr);
  if(!logs.length) return;
  expandedSession = logs[0].id||logs[0].date;
  filterDay = 'All';
  switchTab('history');
}

// ── AUTH ──
function showAuth(){
  if(document.getElementById('auth-screen')) return;
  const d=document.createElement('div');
  d.id='auth-screen';
  d.className='auth-screen';
  d.innerHTML=`<div class="auth-box">
    <div class="auth-logo">VO2<span>Strength</span></div>
    <div class="auth-sub">Clinical Exercise Prescription</div>
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="at-signin" onclick="authSwitch('signin')">Sign In</button>
      <button class="auth-tab-btn" id="at-signup" onclick="authSwitch('signup')">Sign Up</button>
    </div>
    <div class="auth-error" id="auth-err"></div>
    <div id="auth-name-wrap" style="display:none;" class="auth-field">
      <input id="auth-name" type="text" placeholder="Full name"/>
    </div>
    <div id="auth-username-wrap" style="display:none;" class="auth-field">
      <input id="auth-username" type="text" placeholder="Username (optional)"/>
    </div>
    <div class="auth-field"><input id="auth-email" type="email" placeholder="Email"/></div>
    <div class="auth-field auth-pw-wrap">
      <input id="auth-pw" type="password" placeholder="Password"/>
      <button class="auth-pw-eye" onclick="togglePw()">&#128065;</button>
    </div>
    <button class="auth-submit" id="auth-btn" onclick="doAuth()">Sign In</button>
    <div class="auth-guest"><button onclick="continueGuest()">Continue without account</button></div>
  </div>`;
  document.body.appendChild(d);
  document.addEventListener('keydown',authEnter);
}

let authMode='signin';
function authSwitch(mode){
  authMode=mode;
  const isUp=mode==='signup';
  document.getElementById('at-signin').className='auth-tab-btn'+(isUp?'':' active');
  document.getElementById('at-signup').className='auth-tab-btn'+(isUp?' active':'');
  document.getElementById('auth-name-wrap').style.display=isUp?'block':'none';
  document.getElementById('auth-username-wrap').style.display=isUp?'block':'none';
  document.getElementById('auth-btn').textContent=isUp?'Create Account':'Sign In';
  const err=document.getElementById('auth-err');
  err.style.display='none';
}
function togglePw(){
  const inp=document.getElementById('auth-pw');
  const btn=inp.nextElementSibling;
  inp.type=inp.type==='password'?'text':'password';
  btn.innerHTML=inp.type==='password'?'&#128065;':'&#128584;';
}
function authEnter(e){ if(e.key==='Enter'&&document.getElementById('auth-screen')) doAuth(); }
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pw=document.getElementById('auth-pw').value;
  const btn=document.getElementById('auth-btn');
  const err=document.getElementById('auth-err');
  err.style.display='none';
  if(!email||!pw){showAuthErr('Please enter email and password.');return;}
  btn.textContent='Please wait...';btn.disabled=true;
  try{
    if(authMode==='signup'){
      const name=document.getElementById('auth-name').value.trim();
      const username=document.getElementById('auth-username').value.trim();
      const {error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name,username}}});
      if(error)throw error;
      err.className='auth-error ok';
      err.textContent='Account created! Check your email to confirm, then sign in.';
      err.style.display='block';
    } else {
      const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error)throw error;
      document.getElementById('auth-screen')?.remove();
      document.removeEventListener('keydown',authEnter);
    }
  }catch(e){
    showAuthErr(e.message||'Something went wrong.');
  }
  btn.textContent=authMode==='signup'?'Create Account':'Sign In';
  btn.disabled=false;
}
function showAuthErr(msg){
  const err=document.getElementById('auth-err');
  err.className='auth-error err';err.textContent=msg;err.style.display='block';
}
function continueGuest(){
  document.getElementById('auth-screen')?.remove();
  document.removeEventListener('keydown',authEnter);
  renderTab(activeTab);
}

function showUserMenu(){
  if(confirm('Sign out of VO2Strength?')){
    sb.auth.signOut().then(()=>{currentUser=null;showAuth();});
  }
}
